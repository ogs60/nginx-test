<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Nginx CI Demo</title>

<style>
body {
    font-family: Arial;
    background:#f5f5f5;
}

.box {
    width:600px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:10px;
}

.item {
    margin:15px;
    font-size:18px;
}
</style>

</head>

<body>

<div class="box">

<h1>Nginx CI/CD Demo</h1>


<div class="item">
构建版本:
<span id="commit">loading...</span>
</div>


<div class="item">
容器启动时间:
<span id="start">loading...</span>
</div>


<div class="item">
运行时间:
<span id="uptime">loading...</span>
</div>


<div class="item">
访问次数:
<span id="count">loading...</span>
</div>


</div>


<script>

async function load(){

    let v = await fetch("/version.json")
        .then(r=>r.json());


    document.getElementById("commit").innerHTML =
        v.commit;


    document.getElementById("start").innerHTML =
        v.start_time;


    let now=new Date();
    let start=new Date(v.start_time);

    let sec=parseInt(
        (now-start)/1000
    );


    let day=parseInt(sec/86400);
    let hour=parseInt((sec%86400)/3600);
    let min=parseInt((sec%3600)/60);
    let s=sec%60;


    document.getElementById("uptime").innerHTML =
        `${day}天 ${hour}小时 ${min}分钟 ${s}秒`;



    let c=await fetch("/count")
        .then(r=>r.text());


    document.getElementById("count").innerHTML=c;

}


load();

setInterval(load,1000);


</script>


</body>
</html>
